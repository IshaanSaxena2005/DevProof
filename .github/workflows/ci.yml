name: CI

# Runs on every push and pull request to main. The three jobs below each catch
# a failure class that has reached a teammate's machine before: an uninstalled
# dependency, an unapplied migration, and a stale Prisma client.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — migrate, typecheck, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devproof
          POSTGRES_PASSWORD: devproof_ci
          POSTGRES_DB: devproof_ci
        ports:
          - 5432:5432
        # Without this the first migration can race the server's startup.
        options: >-
          --health-cmd "pg_isready -U devproof -d devproof_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # CI uses the default port; only local dev needs 5434.
      DATABASE_URL: postgresql://devproof:devproof_ci@localhost:5432/devproof_ci?schema=public
      # Required by config/env.ts at import, which every test transitively loads.
      # Not a secret: no token signed here is ever accepted anywhere.
      JWT_SECRET: ci-placeholder-secret-not-used-for-real-tokens

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      # `npm ci` installs exactly the lockfile and fails if package.json and the
      # lockfile disagree — which is what catches a dependency added in code but
      # never committed.
      - name: Install dependencies
        working-directory: Backend
        run: npm ci

      # Applies every migration to an empty database, so a migration that only
      # works against an already-populated schema fails here rather than on a
      # teammate's machine or in production.
      - name: Apply migrations
        working-directory: Backend
        run: npx prisma migrate deploy

      - name: Generate Prisma client
        working-directory: Backend
        run: npx prisma generate

      # Fails when the committed migrations do not reproduce schema.prisma —
      # the drift that appears when a schema change is hand-applied without a
      # matching migration.
      - name: Check schema and migrations agree
        working-directory: Backend
        run: |
          DRIFT=$(npx prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --script | grep -v '^--' | grep -v '^$' || true)
          if [ -n "$DRIFT" ]; then
            echo "Schema drift detected — migrations do not reproduce schema.prisma:"
            echo "$DRIFT"
            exit 1
          fi
          echo "No drift."

      # `npm test` builds first, so this covers typechecking too. The
      # integration suite reuses the service container above: CI is set, so the
      # harness treats this database as disposable rather than deriving a
      # separate one the way it does locally.
      - name: Build and test
        working-directory: Backend
        run: npm test

      # Fails on a high or critical advisory in anything that actually ships.
      # devDependencies are excluded deliberately: a ReDoS in the hot-reload
      # file watcher is a different risk class from one in a request path, and
      # blocking every push on it would train everyone to ignore this step.
      - name: Audit production dependencies
        working-directory: Backend
        run: npm audit --omit=dev --audit-level=high

      # Everything else, including dev tooling, reported but never blocking so
      # it stays visible without becoming noise.
      - name: Report all advisories
        working-directory: Backend
        continue-on-error: true
        run: npm audit

  frontend:
    name: Frontend — typecheck and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        working-directory: Frontend
        run: npm ci

      # `npm run build` is `tsc && vite build`, so a type error fails here.
      - name: Typecheck and build
        working-directory: Frontend
        run: npm run build

      # The frontend suite is plain node:test over extracted logic (UTC date
      # handling, difficulty fallbacks, demo fixtures, the API client's
      # envelope/demo guarantees) — no browser or backend needed, so it can run
      # right after the build on every push.
      - name: Run frontend tests
        working-directory: Frontend
        run: npm test

      # Fails on a high or critical advisory in anything that actually ships.
      # devDependencies are excluded deliberately: a ReDoS in the hot-reload
      # file watcher is a different risk class from one in a request path, and
      # blocking every push on it would train everyone to ignore this step.
      - name: Audit production dependencies
        working-directory: Frontend
        run: npm audit --omit=dev --audit-level=high

      # Everything else, including dev tooling, reported but never blocking so
      # it stays visible without becoming noise.
      - name: Report all advisories
        working-directory: Frontend
        continue-on-error: true
        run: npm audit

  browser-e2e:
    name: Browser E2E — Playwright journeys
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devproof
          POSTGRES_PASSWORD: devproof_ci
          POSTGRES_DB: devproof_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devproof -d devproof_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Dedicated and disposable: e2e/start-backend.mjs drops and recreates
      # devproof_e2e_ci on every run, applying the committed migrations.
      E2E_DATABASE_URL: postgresql://devproof:devproof_ci@localhost:5432/devproof_e2e_ci?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            Frontend/package-lock.json
            Backend/package-lock.json

      - name: Install backend dependencies
        working-directory: Backend
        run: npm ci

      # The suite runs the compiled server (dist/server.js), never ts-node.
      - name: Build backend
        working-directory: Backend
        run: npm run build

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: Frontend
        run: npx playwright install --with-deps chromium

      # test:e2e builds the isolated bundle (dist-e2e) first, then Playwright
      # starts the backend wrapper (isolated DB, GitHub/Groq disabled) and the
      # vite preview server, and runs the six journey specs.
      - name: Run browser E2E suite
        working-directory: Frontend
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            Frontend/playwright-report
            Frontend/test-results
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The Dockerfiles are the deployment path and nothing else exercises them,
      # so a broken one would otherwise only surface at deploy time.
      - name: Build backend image
        run: docker build -t devproof-backend:ci ./Backend

      - name: Build frontend image
        run: docker build -t devproof-frontend:ci --build-arg VITE_API_URL=http://localhost:5000/api/v1 ./Frontend
