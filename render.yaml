# DevProof — Render Blueprint
#
# Defines the backend API. The dashboard is hosted separately on Vercel
# (https://devproof-project.vercel.app) and the database on Neon; neither is
# described here, because a Blueprint owns the services it names and Render
# cannot manage either one.
#
# Create it from the Render dashboard: Blueprints -> New Blueprint Instance, pick
# this repository, and Render prompts for each value marked `sync: false`. Only
# the GitHub App credentials are actually required; the rest have defaults or
# degrade to a clear error on the one route that needs them.
#
# ── The browser never talks to this service directly ─────────────────
# Frontend/vercel.json proxies /api/* from the dashboard's own domain to this
# one. That is not a convenience: served from onrender.com, the session cookie
# is third-party to a page on vercel.app, and Brave, Safari and every private
# window drop it — sign-in succeeds, then the first /auth/me returns 401 and
# the user lands back on the login page. Behind the proxy both cookies are
# first-party and none of that applies.
#
# It follows that the two URLs below are vercel.app addresses, not this
# service's, and that CORS no longer carries any weight: the requests are
# same-origin by the time the browser sees them.
#
# ── After the first deploy, three things still have to be done by hand ─────
#  1. Set VITE_API_URL on Vercel to the relative path /api/v1 and redeploy.
#     Vite bakes it in at build time, so the variable alone changes nothing
#     until a build runs.
#  2. Point the GitHub App's callback URL at
#     https://<dashboard-domain>/api/v1/auth/github/callback
#     and set GITHUB_CALLBACK_URL below to the same string. Both go through
#     the proxy, which is what makes the OAuth state cookie first-party too.
#  3. Check FRONTEND_URL below still matches the Vercel production domain. It
#     is the post-sign-in redirect target, and a Vercel *preview* deployment
#     has a different hostname that this will not match — by design, since
#     previews are not trusted origins.
#
# ── What the free plan costs, chosen deliberately ──────────────────────────
#  - The API sleeps after 15 minutes without traffic and takes about a minute
#    to wake. The first visitor after a quiet spell sees a page that looks
#    broken. Nothing in this file changes that: spin-down is a property of the
#    free instance type, not a setting. Warm it up before a demo, or move to
#    `plan: starter` below.
#  - The filesystem is ephemeral and free instances cannot mount a disk, so
#    every uploaded resume is lost on each deploy, restart and spin-down. The
#    database rows survive and will point at files that no longer exist.
#
# The database is deliberately NOT Render's. A free Render Postgres expires 30
# days after creation and is deleted 14 days later, so keeping one alive means
# dumping, deleting, recreating and repointing it every month — a chore that
# loses the data the first time anyone forgets. Neon's free plan is permanent,
# so DATABASE_URL below points there instead. The Render database block is kept
# at the bottom of this file, commented, for whoever wants it back.
# ───────────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: devproof-api
    runtime: docker
    # `starter` is the one-word change that makes this always-on, and the only
    # thing that does; it also unlocks the `disk:` block at the bottom.
    plan: free
    region: oregon
    # Both paths are relative to the repository root, which is what Render
    # resolves them against. The context is Backend/ so the Dockerfile's
    # `COPY . .` picks up the backend alone, exactly as it does locally.
    dockerfilePath: ./Backend/Dockerfile
    dockerContext: ./Backend
    # Frontend-only commits should not rebuild the API.
    buildFilter:
      paths:
        - Backend/**
        - render.yaml
    # The container runs `prisma migrate deploy` before starting, so a new
    # database is brought up to date on first boot with no release phase.
    healthCheckPath: /api/v1/health

    envVars:
      - key: NODE_ENV
        value: production

      # Render terminates TLS and proxies to the container, so X-Forwarded-For
      # carries the real client address. Exactly one hop: a count rather than
      # `true`, so a client cannot forge the IP the rate limiters key on. Left
      # unset, every caller would look like the proxy and the 200-request
      # window would be shared by the whole internet.
      - key: TRUST_PROXY
        value: 1

      # Render supplies PORT and the server reads it; set explicitly so the
      # value is visible in the dashboard rather than implied.
      - key: PORT
        value: 5000

      # Neon connection string, pasted at Blueprint creation. Use the DIRECT
      # endpoint, not the pooled one: the container runs `prisma migrate deploy`
      # at boot, and migrations want a real session rather than a PgBouncer
      # connection. Keep `?sslmode=require` — Neon refuses plaintext.
      #
      # Pick the Neon region closest to this service's own (Oregon is AWS
      # us-west-2); every query crosses that gap, so a mismatched pair adds
      # latency to each one.
      - key: DATABASE_URL
        sync: false

      # Generated once by Render and never written to the repo. Changing it
      # later invalidates every existing session, which is intended.
      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: 7d

      # The dashboard's production origin, no trailing slash — Express compares
      # the Origin header literally, and a trailing slash never matches.
      #
      # vercel.app is on the Public Suffix List, so this is a different *site*
      # from the API, not merely a different origin: the session cookie has to
      # be SameSite=None, which config/cookies.ts does whenever NODE_ENV is
      # production. Pointing this at a same-site host would not undo that.
      - key: FRONTEND_URL
        value: https://devproof-project.vercel.app

      # ── GitHub App ───────────────────────────────────────────────────────
      # Sign-in is through a GitHub App, not an OAuth App: the client id starts
      # with Iv1. or Iv23 and the server rejects anything else.
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      # Must byte-for-byte match the callback registered on the App itself.
      - key: GITHUB_CALLBACK_URL
        sync: false
      # Optional, and safe to leave blank at creation — every one of these has
      # an empty default, and the server boots without them.
      #
      #   GITHUB_APP_SLUG       the slug in github.com/apps/<slug>. Only builds
      #                         the "install DevProof" link; without it the user
      #                         lands on their generic installations page, which
      #                         is one extra click rather than a dead end.
      #   GITHUB_WEBHOOK_SECRET a string you invent and paste into the App's
      #                         webhook settings. Without it the webhook route
      #                         refuses every payload with a 503; nothing else
      #                         is affected.
      #
      # GITHUB_APP_ID and GITHUB_PRIVATE_KEY are deliberately absent. They feed
      # createAppJwt(), which nothing currently calls — they would only change a
      # boolean on the webhook status endpoint. Sign-in and repository sync run
      # on the user-to-server token from the client id/secret above, so there is
      # nothing to generate until an app-level API call actually exists.
      - key: GITHUB_APP_SLUG
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false

      # Optional. Absent, the server still starts and only AI insights fail,
      # with a 503 that says why.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

    # ── Resume uploads ───────────────────────────────────────────────────
    # Uncomment on a paid instance to keep uploaded files across deploys, then
    # add UPLOAD_ROOT=/var/data/resumes to the variables above so the service
    # writes to the mount instead of the container. Files written before the
    # disk existed are not migrated — they are already gone by then.
    #
    # disk:
    #   name: devproof-uploads
    #   mountPath: /var/data
    #   sizeGB: 1

# ── Using Render's own Postgres instead ──────────────────────────────────
# Uncomment this block and swap the DATABASE_URL entry above back to
#
#   - key: DATABASE_URL
#     fromDatabase:
#       name: devproof-db
#       property: connectionString
#
# On the free plan, note the expiry date the moment it is created: 30 days to
# expiry, 14 more before deletion, one free database per workspace. Surviving
# that cycle means `pg_dump` out, delete, recreate, restore, repoint, redeploy
# — every month, by hand. A paid plan removes the expiry entirely.
#
# databases:
#   - name: devproof-db
#     databaseName: devproof
#     user: devproof
#     plan: free
#     region: oregon
